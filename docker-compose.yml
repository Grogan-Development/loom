services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - loomd
    networks:
      - loom

  loomd:
    build: .
    image: loom:local
    restart: unless-stopped
    environment:
      LOOM_TOKEN: ${LOOM_TOKEN:?set LOOM_TOKEN}
      LOOM_DEPLOY_TOKEN: ${LOOM_DEPLOY_TOKEN:-}
      LOOM_BIND: 0.0.0.0:8080
      LOOM_ROOT: /data/loom
    volumes:
      - loom-data:/data/loom
    healthcheck:
      test: ["CMD", "sh", "-c", "command -v loomd"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - loom

networks:
  loom:
    name: loom-apps

volumes:
  loom-data:
  caddy-data:
