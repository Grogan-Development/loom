services:
  loom:
    build: .
    image: loom:local
    restart: unless-stopped
    environment:
      LOOM_TOKEN: ${LOOM_TOKEN:?set LOOM_TOKEN}
      LOOM_BIND: 0.0.0.0:8080
      LOOM_ROOT: /data/loom
    ports:
      - "8080:8080"
    volumes:
      - loom-data:/data/loom
    healthcheck:
      test: ["CMD", "sh", "-c", "command -v loom"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  loom-data:
