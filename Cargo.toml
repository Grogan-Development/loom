[workspace]
resolver = "3"
members = ["crates/loom"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "LicenseRef-Proprietary"
authors = ["Grogan"]
repository = "https://origin.cursor.com/loom"

[workspace.dependencies]
axum = "=0.8.9"
base64ct = { version = "=1.8.3", features = ["alloc"] }
clap = { version = "=4.6.6", features = ["derive", "env"] }
http-body-util = "=0.1.4"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
subtle = "=2.6.1"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
time = { version = "=0.3.55", features = ["formatting", "parsing", "serde"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "=0.9.5"
tower = { version = "=0.5.3", features = ["util"] }
uuid = { version = "=1.24.0", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
